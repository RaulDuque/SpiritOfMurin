const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false, noiseBuf = null;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
    try {
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.6), ac.sampleRate);
      const d = noiseBuf.getChannelData(0); let s = 12345;
      for (let i = 0; i < d.length; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = s / 0x3fffffff - 1; }
    } catch (e) { noiseBuf = null; }
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0, freqEnd = 0) {

  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);

      tone(1568, 0.6, 'triangle', 0.05, 0.14); tone(2349, 0.5, 'sine', 0.04, 0.2); break;

// ---- Math -------------------------------------------------------------------------------
const DEG = Math.PI / 180;
const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);

function wrapA(d) { d %= 2 * Math.PI; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; return d; }
const angDiff = (a, b) => Math.abs(wrapA(b - a));
function turnToward(a, b, max) { const d = wrapA(b - a); return Math.abs(d) <= max ? b : a + Math.sign(d) * max; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; }

// ---- The region -------------------------------------------------------------------------
const TS = 32, MW = 60, MH = 40;
const G = 0, ROCK = 1, WATER = 2, CHASM = 3, BRIDGE = 4, PATH = 5, TFLOOR = 6, TWALL = 7, BAMBOO = 8,
  GATE = 9, CAMP = 10, DOOR = 11, TENT = 12, STELE = 13, CUTWALL = 14;
let map;
function buildMap() {

  const rect = (x0, y0, x1, y1, v) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, v); };
  rect(2, 2, 57, 12, CAMP);                       // the disciples' camp
  rect(0, 13, MW - 1, 14, ROCK); rect(27, 13, 30, 13, GATE); rect(27, 14, 30, 14, CAMP);
  rect(0, 17, MW - 1, 19, WATER); rect(27, 17, 30, 19, BRIDGE);
  rect(0, 0, MW - 1, 1, ROCK); rect(0, MH - 2, MW - 1, MH - 1, ROCK); rect(0, 0, 1, MH - 1, ROCK); rect(MW - 2, 0, MW - 1, MH - 1, ROCK);
  rect(28, 20, 29, 36, PATH); rect(30, 33, 42, 34, PATH); rect(42, 31, 43, 34, PATH); rect(43, 31, 51, 31, PATH);
  rect(21, 20, 22, MH - 3, CHASM);                // the gap, seen from the start
  rect(45, 21, 56, 30, TWALL); rect(46, 22, 55, 29, TFLOOR); rect(50, 30, 51, 30, DOOR); rect(50, 21, 51, 21, CUTWALL);
  set(48, 32, ROCK); set(53, 32, ROCK);           // the twin stones
  rect(7, 4, 10, 6, TENT); rect(47, 4, 50, 6, TENT); rect(15, 8, 17, 9, TENT); rect(40, 8, 42, 9, TENT);
  rect(34, 22, 36, 27, BAMBOO); rect(16, 23, 18, 25, BAMBOO); rect(38, 36, 44, 37, BAMBOO);
  rect(3, 34, 6, 37, BAMBOO); rect(4, 21, 6, 23, BAMBOO); rect(52, 33, 56, 37, BAMBOO); rect(2, 2, 4, 4, BAMBOO); rect(54, 9, 56, 11, BAMBOO);
  for (const [x, y] of [[24, 30], [33, 29], [18, 34], [39, 24], [9, 32], [19, 37], [44, 26], [31, 24], [11, 10], [36, 4], [21, 5]]) set(x, y, ROCK);

}
function tileAt(px, py) {
  const tx = Math.floor(px / TS), ty = Math.floor(py / TS);
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return ROCK;
  return map[ty * MW + tx];
}
function tileXY(tx, ty) { return (tx < 0 || ty < 0 || tx >= MW || ty >= MH) ? ROCK : map[ty * MW + tx]; }
function solidTile(t, cross) {
  if (t === ROCK || t === TWALL || t === BAMBOO || t === TENT || t === STELE || t === CUTWALL || t === WATER) return true;
  if (t === CHASM) return !cross;
  if (t === GATE) return !state.gateOpen;
  if (t === DOOR) return !state.doorOpen;

}
const PROBE = [[-1, 0], [1, 0], [0, -1], [0, 1], [-0.7, -0.7], [0.7, -0.7], [-0.7, 0.7], [0.7, 0.7], [0, 0]];

  for (const [ox, oy] of PROBE) if (solidTile(tileAt(x + ox * r, y + oy * r), cross)) return true;
  return false;
}
function moveEnt(e, dx, dy, cross = false) {
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 5));
  let moved = false;
  for (let i = 0; i < n; i++) {
    const sx = dx / n, sy = dy / n;
    if (!blocked(e.x + sx, e.y, e.r, cross)) { e.x += sx; moved = true; }

}
function areaName(x, y) {
  const tx = x / TS, ty = y / TS;
  if (ty < 13) return 'Acampamento dos Discípulos';
  if (ty < 20) return 'Ponte do Rio Nublado';
  if (tx < 21) return 'Além da Fenda';
  if (tx >= 45 && tx < 57 && ty >= 21 && ty < 31) return 'Túmulo da Mestra';
  if (tx > 36) return 'Vale de Bambus';

// Places
const START = { x: 29 * TS, y: 35.5 * TS };
const CAMP_ENTRY = { x: 29 * TS, y: 11.4 * TS };
const STATUE = { x: 51 * TS, y: 25.4 * TS };
const MARKS = [90, 140, 192].map(a => ({ x: STATUE.x + Math.cos(a * DEG) * 60, y: STATUE.y + Math.sin(a * DEG) * 60 }));

  slab: { x: 51 * TS, y: 22.7 * TS, r: 34 },

// ---- Fighters ---------------------------------------------------------------------------
function makePlayer() {

    inv: 0, hitstun: 0, kx: 0, ky: 0, flash: 0, walk: 0, moving: false, ghosts: [], dead: false };

  const e = { type, x, y, hx: x, hy: y, r: 8, face: Math.PI / 2, st: 'idle', t: 0, wt: 0, fooled: 0, parries: 0, cd: 0.8,

function toast(s, t = 3.2) { state.toasts.push({ s, t }); if (state.toasts.length > 3) state.toasts.shift(); }
function once(flag, fn) { if (!state.flags[flag]) { state.flags[flag] = true; fn(); } }

// ---- Player actions ---------------------------------------------------------------------
function lockTarget() { const l = state.lock; return l && l.alive ? l : null; }
function relDir(mx, my) {
  const p = state.p, tg = lockTarget();
  if (!mx && !my) return { kind: 'none' };
  const f = tg ? { x: Math.cos(angTo(p, tg)), y: Math.sin(angTo(p, tg)) } : { x: Math.cos(p.face), y: Math.sin(p.face) };

function startAction(b) {

    if (rel.kind === 'fwd' && tg) {
      a = { kind: 'thrust', su: 0.09, ac: 0.1, rc: 0.28, cancelAt: 0.17, dmg: tune.thrust_damage, range: tune.thrust_range, arc: 40, lunge: 22 };
    } else {

        : { kind: 'cut', n, su: tune.cut_startup, ac: tune.cut_active, rc: tune.cut_recovery, cancelAt: tune.cut_cancel_at, dmg: tune.cut_damage, range: tune.cut_range, arc: tune.cut_arc, lunge: 8 };

    if (p.qi < tune.qi_cost) { sfx('fizzle'); once('noqi', () => toast('Seu qi ainda não se recompôs.')); return; }

    const h = state.hist, p1 = h[h.length - 1], p2 = h[h.length - 2];
    const lamina = !!(p1 && p2 && p2.k === 'side' && (p1.k === 'cut' || p1.k === 'thrust') &&

    a = { kind: 'qi', su: 0.1, ac: 0.02, rc: 0.22, cancelAt: 0.16, lamina, fired: false };
    sfx('qi');

    if (state.learnedSide && tg && rel.kind === 'lat') {
      const R = clamp(dist(p, tg), 46, 92), a0 = angTo(tg, p);
      a = { kind: 'side', dur: tune.side_step_time, cancelAt: tune.side_step_time * 0.7, cx: tg.x, cy: tg.y, R, a0,
        a1: a0 - rel.side * tune.side_step_angle * DEG }; // the orbit goes the way the key points
      p.inv = Math.max(p.inv, tune.side_step_iframes);
      if (tg.type !== 'statue') tg.fooled = tg.type === 'senior' ? tune.sen_fooled : tune.dis_fooled;

      p.inv = Math.max(p.inv, 0.12);
      sfx('side');

      if (rel.kind === 'lat' && !state.learnedSide) once('nolat', () => toast('Você ainda não sabe pisar para o lado.'));
      let dir = rel.kind === 'fwd' ? 1 : -1;
      const base = tg ? angTo(p, tg) : p.face;

  }
  MARKS.forEach(m => { ctx.fillStyle = C.learn; ctx.fillRect(Math.round(m.x - cx) - 3, Math.round(m.y - cy) - 3, 6, 6); });
  ctx.globalAlpha = Math.min(1, (3.2 - k) * 2, k * 2);
  textS('PASSO LATERAL', W / 2, 70, 20, C.learn, 'center', '#14403c');
  text('Agora você entende onde ela pisava.', W / 2, 94, 11, C.ui);
  text('A guarda que olha para a frente não vê quem pisa ao lado.', W / 2, 110, 10, C.qiHi);
  ctx.globalAlpha = 1;
}

// ---- Scenes ------------------------------------------------------------------------------
function camPos() {
  const p = state.p, tg = lockTarget();
  let tx = p.x, ty = p.y - 16;
  if (tg) { tx = (p.x * 0.6 + tg.x * 0.4); ty = (p.y * 0.6 + tg.y * 0.4) - 16; }
  return [tx, ty];
}
function drawPlay() {
  const [tx, ty] = camPos();
  state.cam.x += (tx - state.cam.x) * 0.15; state.cam.y += (ty - state.cam.y) * 0.15;
  state.cam.x = clamp(state.cam.x, W / 2, MW * TS - W / 2); state.cam.y = clamp(state.cam.y, H / 2 - 10, MH * TS - H / 2);
  const sh = state.shake > 0 ? Math.round((hash(Math.floor(state.t * 60), 3) % 3 - 1) * state.shake) : 0;
  const sv = state.shake > 0 ? Math.round((hash(Math.floor(state.t * 60), 9) % 3 - 1) * state.shake) : 0;
  const cx = Math.round(state.cam.x - W / 2) + sh, cy = Math.round(state.cam.y - H / 2) + sv;
  clear('#0d0f0c');
  drawWorld(cx, cy);
  if (state.dying > 0) { ctx.fillStyle = `rgba(10,6,4,${clamp(1 - state.dying / 1.5, 0, 0.85)})`; ctx.fillRect(0, 0, W, H); if (state.dying < 1.1) textS('Derrotado', W / 2, H / 2 - 10, 18, C.ui); }
  drawHUD();
  if (state.reveal > 0) drawReveal();
  drawPanel();
}
function drawMountains() {
  clear('#1b2321');
  ctx.fillStyle = '#25302c'; for (let x = 0; x < W; x += 2) { const h2 = 120 + Math.sin(x * 0.013) * 40 + Math.sin(x * 0.041) * 14; ctx.fillRect(x, H - h2, 2, h2); }
  ctx.fillStyle = '#2f3d36'; for (let x = 0; x < W; x += 2) { const h2 = 80 + Math.sin(x * 0.021 + 2) * 26 + Math.sin(x * 0.07) * 8; ctx.fillRect(x, H - h2, 2, h2); }
  ctx.fillStyle = '#3a4a3c'; for (let x = 0; x < W; x += 2) { const h2 = 40 + Math.sin(x * 0.03 + 4) * 12; ctx.fillRect(x, H - h2, 2, h2); }
  ctx.fillStyle = 'rgba(200,220,210,0.05)'; ctx.fillRect(0, H - 150, W, 30); ctx.fillRect(0, H - 100, W, 18);
}
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      drawMountains();
      ctx.fillStyle = C.ground; ctx.fillRect(0, 190, W, 120);
      const row = [['player', 'O espadachim (você)', 'idle'], ['disciple', NAMES.disciple, 'guard'], ['senior', NAMES.senior, 'attack'], ['statue', NAMES.statue, 'guard']];
      row.forEach(([k, n, pose], i) => {
        const x = 90 + i * 150, y = 260;
        shadow(x, y); drawFighter(x, y, Math.PI / 2, k, pose, { t: state.t, aura: k === 'senior' });
        text(n, x, y + 22, 9, C.ui);
      });
      drawDead(90 + 1.5 * 150, 320, 'disciple', true); text('Discípulo caído (o manual)', 90 + 1.5 * 150, 340, 9, C.uiDim);
    },
  },
  title: {
    update(dt) { state.t += dt; if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; } },
    draw() {
      drawMountains();
      shadow(W / 2, 168, 14); drawFighter(W / 2, 168, Math.PI / 2, 'player', 'guard', { t: state.t });
      textS(TITLE, W / 2, 44, 30, C.ui);
      text('O Passo da Mestra', W / 2, 70, 12, C.learnGlow);
      ctx.fillStyle = C.panel; ctx.fillRect(W / 2 - 170, 184, 340, CONTROLS.length * 14 + 12);
      CONTROLS.forEach((c, i) => text(c, W / 2, 196 + i * 14, 11, C.ui));
      text('Enter para começar', W / 2, H - 20, 12, Math.floor(state.t * 2) % 2 ? C.ui : C.uiDim);
    },
  },
  play: {
    update(dt) { updatePlay(dt); },
    draw() { drawPlay(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) scene = 'play'; },
    draw() { drawPlay(); ctx.fillStyle = 'rgba(8,10,8,0.6)'; ctx.fillRect(0, 0, W, H); textS('Pausa', W / 2, H / 2 - 30, 20, C.ui);
      CONTROLS.forEach((c, i) => text(c, W / 2, H / 2 + i * 14, 10, C.uiDim)); },
  },
  registro: {
    update() { if (pressed('Tab') || pressed('Escape') || pressed('KeyE')) scene = 'play'; },
    draw() {
      drawPlay(); ctx.fillStyle = 'rgba(8,10,8,0.82)'; ctx.fillRect(0, 0, W, H);
      textS('Registro de técnicas', W / 2, 24, 16, C.ui); ctx.fillStyle = C.uiDim; ctx.fillRect(W / 2 - 110, 36, 220, 1);
      let y = 54;
      for (const r of state.reg) {
        const c = r.kind === 'combinação' ? C.learn : r.kind === 'fragmento' ? C.amberHi : C.qiHi;
        text(r.name, 40, y, 11, c, 'left'); text(r.kind + (r.key ? '  ·  ' + r.key : ''), W - 40, y, 9, C.uiDim, 'right', false);
        y += 13;
        for (const l of wrapLines(r.where, 92)) { text(l, 52, y, 9, C.ui, 'left', false); y += 11; }
        y += 6;
      }
      text('Tab: voltar', W / 2, H - 12, 9, C.uiDim, 'center', false);
    },
  },
  results: {
    update(dt) { state.t += dt; if (pressed('Enter')) { reset(); scene = 'play'; } },
    draw() {
      drawPlay(); ctx.fillStyle = 'rgba(6,10,9,0.78)'; ctx.fillRect(0, 0, W, H);
      textS('VITÓRIA', W / 2, 90, 26, C.learn, 'center', '#14403c');
      text('O Espadachim Sênior cai. Este é o primeiro passo do caminho.', W / 2, 124, 11, C.ui);
      text(state.gained, W / 2, 150, 11, C.ui);
      text(state.comboFound ? 'Passo da Lâmina Silenciosa: descoberto por você.' : 'Uma combinação ainda espera por você. A inscrição além da fenda sabe qual.', W / 2, 176, 10, state.comboFound ? C.learn : C.amberHi);
      text('Enter: jogar de novo', W / 2, H - 40, 12, C.ui);
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
