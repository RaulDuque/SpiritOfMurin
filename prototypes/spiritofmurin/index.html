function say(e, s) { state.speech = { e, s, t: 3.4 }; }

// ---- Meditation: one local save slot ----------------------------------------------------

    gateOpen: state.gateOpen, comboFound: state.comboFound, steleRead: state.steleRead, chestOpen: state.chestOpen,

function validJourney(d) {

  const str = v => typeof v === 'string';

  if (!d.p || !num(d.p.hp, 1, 99) || !num(d.p.qi, 0, 999)) return false;
  for (const k of ['learnedSide', 'hasManual', 'doorOpen', 'slabRead', 'gateOpen', 'comboFound', 'steleRead', 'chestOpen']) if (!bool(d[k])) return false;
  if (d.respawn !== 'start' && d.respawn !== 'camp') return false;
  if (!Array.isArray(d.reg) || !d.reg.every(r => r && str(r.name) && str(r.kind) && str(r.key) && str(r.where))) return false;
  if (!Array.isArray(d.quests) || !d.quests.every(q => q && q.id in QUESTS && num(q.x, 0, 1e5) && num(q.y, 0, 1e5) && bool(q.done))) return false;
  if (!d.inv || typeof d.inv !== 'object' || !Object.entries(d.inv).every(([id, n]) => id in ITEMS && num(n, 0, 9999))) return false;
  if (!Array.isArray(d.invOrder) || !d.invOrder.every(id => id in ITEMS)) return false;
  if (!Array.isArray(d.pots) || d.pots.length !== POTS.length || !d.pots.every(bool)) return false;
  if (!Array.isArray(d.herbs) || d.herbs.length !== HERBS.length || !d.herbs.every(bool)) return false;
  if (!Array.isArray(d.enemies) || d.enemies.length !== 6 || !d.enemies.every(e => e && bool(e.alive) && bool(e.said))) return false;
  if (!Array.isArray(d.pickups) || !d.pickups.every(it => it && it.id in ITEMS && num(it.n, 1, 999) && num(it.x, 0, 1e5) && num(it.y, 0, 1e5))) return false;

// what the title finds: { kind: 'none' } | { kind: 'ok', data } | { kind: 'invalid' } | { kind: 'blocked' }
function readJourney() {

// ---- Play update ------------------------------------------------------------------------
function updatePlay(dt) {
  const p = state.p;
  state.t += dt;
  // particles, toasts and text keep moving through hitstop
  for (const q of state.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.9; q.vy *= 0.9; q.life -= dt; }
  state.parts = state.parts.filter(q => q.life > 0);
  for (const f of state.fx) f.life -= dt; state.fx = state.fx.filter(f => f.life > 0);
  for (const f of state.trails) f.life -= dt; state.trails = state.trails.filter(f => f.life > 0);
  for (const g of p.ghosts) g.life -= dt; p.ghosts = p.ghosts.filter(g => g.life > 0);
  for (const s of state.toasts) s.t -= dt; state.toasts = state.toasts.filter(s => s.t > 0);
  if (state.banner) { state.banner.t -= dt; if (state.banner.t <= 0) state.banner = null; }
  if (state.speech) { state.speech.t -= dt; if (state.speech.t <= 0) state.speech = null; }
  if (state.comboShow) { state.comboShow.t -= dt; if (state.comboShow.t <= 0) state.comboShow = null; }

  if (state.reveal > 0) {
    state.reveal -= dt;
    if (state.reveal <= 0) {
      toast(`Com o alvo travado: ${K2('step')} + direção para o lado do inimigo.`, 6);
      toast(`Experimente na estátua: ${K('lock')} trava nela.`, 6);
    }
    return;

    update() {
      const items = bagItems(), cols = 6;
      const dx = navX(), dy = navY();
      if (dx || dy) { state.bagSel = clamp(state.bagSel + dx + dy * cols, 0, Math.max(0, items.length - 1)); sfx('menu'); }
      if ((pressed('Enter') || tapped('use')) && items[state.bagSel] && ITEMS[items[state.bagSel]].use) useItem(items[state.bagSel]);
      if (tapped('bag') || pressed('Escape')) { scene = 'play'; sfx('page2'); }
    },
    draw() { drawPlay(); drawBag(); },
  },
  mapa: {
    update() { if (tapped('map') || pressed('Escape')) { scene = 'play'; sfx('page2'); } },
    draw() { drawPlay(); drawMap(); },
  },
  teclas: {
    update() {
      if (teclas.msgT > 0) teclas.msgT -= STEP;
      if (teclas.wait) {
        if (pressed('Escape')) { teclas.wait = false; return; }
        if (teclas.col === 1 && (pressed('Backspace') || pressed('Delete'))) { binds2[ACTIONS[teclas.sel][0]] = ''; saveBinds(); teclas.wait = false; sfx('page2'); return; }
        const code = [...hit][0];
        if (code) assignInput(ACTIONS[teclas.sel][0], teclas.col, code);
        return;
      }
      // the mouse: a click on a row's cap chooses it and waits for the new input
      if (mouse.click && hit.has('Mouse0')) {
        const row = Math.round((mouse.y - 42) / 18);
        if (row >= 0 && row < ACTIONS.length && mouse.x >= 140 && mouse.x <= 580) {
          teclas.sel = row; teclas.col = mouse.x >= 500 ? 1 : 0; teclas.wait = true; sfx('menu');
        } else if (row === ACTIONS.length && mouse.x >= 140 && mouse.x <= 580) { teclas.sel = row; restoreBinds(); }
        else if (mouse.y >= H - 22) scene = teclas.from; // "Voltar"
        return;
      }
      if (navY()) { teclas.sel = clamp(teclas.sel + navY(), 0, ACTIONS.length); sfx('menu'); }
      if (navX()) { teclas.col = clamp(teclas.col + navX(), 0, 1); sfx('menu'); }
      if (pressed('Enter')) {
        if (teclas.sel === ACTIONS.length) restoreBinds();
        else { teclas.wait = true; }
      }
      if (pressed('Escape') || hit.has('Mouse2')) scene = teclas.from;
    },
    draw() {
      if (teclas.from === 'pause') drawPlay(); else drawMountains(true);
      ctx.fillStyle = 'rgba(8,10,8,0.86)'; ctx.fillRect(0, 0, W, H);
      textS('Teclas', W / 2, 12, 14, C.ui);
      text('Tecla', 440, 26, 9, C.uiDim); text('Mouse / extra', 540, 26, 9, C.uiDim);
      ACTIONS.forEach(([id, label], i) => {
        const y = 42 + i * 18, sel = i === teclas.sel;
        if (sel) { ctx.fillStyle = 'rgba(111,216,210,0.16)'; ctx.fillRect(140, y - 8, 440, 16); }
        text(label, 156, y, 11, sel ? C.learn : C.ui, 'left');
        keycap(440, y, sel && teclas.wait && teclas.col === 0 ? '...' : keyLabel(binds[id]), sel && teclas.col === 0);
        keycap(540, y, sel && teclas.wait && teclas.col === 1 ? '...' : (binds2[id] ? keyLabel(binds2[id]) : '—'), sel && teclas.col === 1);
      });
      const ry = 42 + ACTIONS.length * 18, rsel = teclas.sel === ACTIONS.length;
      if (rsel) { ctx.fillStyle = 'rgba(111,216,210,0.16)'; ctx.fillRect(140, ry - 8, 440, 16); }
      text('Restaurar o padrão', 156, ry, 11, rsel ? C.learn : C.uiDim, 'left');
      if (teclas.msgT > 0) text(teclas.msg, W / 2, H - 24, 9, C.amberHi);
      text(teclas.wait ? (teclas.col === 1 ? 'Aperte uma tecla ou botão do mouse (Esc cancela, Backspace limpa)' : 'Aperte uma tecla ou botão do mouse (Esc cancela)')
        : 'Setas: escolher   Enter ou clique: trocar   Esc ou clique direito: voltar', W / 2, H - 10, 10, C.ui);
    },
  },
  results: {
    update(dt) { state.t += dt; if (pressed('Enter')) { reset(); scene = 'play'; } },
    draw() {
      drawPlay(); ctx.fillStyle = 'rgba(6,10,9,0.78)'; ctx.fillRect(0, 0, W, H);
      textS('VITÓRIA', W / 2, 90, 26, C.learn, 'center', '#14403c');
      text('O Espadachim Sênior cai. Este é o primeiro passo do caminho.', W / 2, 124, 11, C.ui);
      text(state.gained, W / 2, 150, 11, C.ui);
      text(state.comboFound ? 'Passo da Lâmina Silenciosa: descoberto por você.' : 'Uma combinação ainda espera por você. A inscrição além da fenda sabe qual.', W / 2, 176, 10, state.comboFound ? C.learn : C.amberHi);
      text('Enter: jogar de novo', W / 2, H - 40, 12, C.ui);
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (scene !== 'teclas' && tapped('mute')) { setMuted(!muted); hit.delete(binds.mute); }
  scenes[scene].update(STEP); hit.clear(); mouse.click = false;
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
